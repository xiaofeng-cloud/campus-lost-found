server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campus-lost-found
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_lost_found?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

app:
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:Admin@123456}
  jwt:
    secret: ${JWT_SECRET:please-change-this-jwt-secret-key-before-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

logging:
  level:
    com.xiaofeng.lostfound: info
